<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380">
  <defs>
    <!-- Purple gradient background circle -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </radialGradient>

    <!-- Panda body gradient -->
    <radialGradient id="bodyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F0FF"/>
    </radialGradient>

    <!-- Thought bubble pulse animation -->
    <style>
      .float-anim {
        animation: float 3s ease-in-out infinite;
      }
      .float-anim-slow {
        animation: float 4s ease-in-out infinite;
      }
      @keyframes float {
        0%   { transform: translateY(0px); }
        50%  { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      .pulse1 { animation: bubble-appear 2s ease-in-out infinite; }
      .pulse2 { animation: bubble-appear 2s ease-in-out 0.4s infinite; }
      .pulse3 { animation: bubble-appear 2s ease-in-out 0.8s infinite; }
      .pulse4 { animation: bubble-appear 2s ease-in-out 1.2s infinite; }
      @keyframes bubble-appear {
        0%   { opacity: 0.2; transform: scale(0.85); }
        50%  { opacity: 1;   transform: scale(1.05); }
        100% { opacity: 0.2; transform: scale(0.85); }
      }
      .blink-eye {
        animation: blink 4s ease-in-out infinite;
        transform-origin: center;
      }
      @keyframes blink {
        0%,92%,100% { transform: scaleY(1); }
        95%          { transform: scaleY(0.08); }
      }
      .book-glow {
        animation: glow 2.5s ease-in-out infinite alternate;
      }
      @keyframes glow {
        from { filter: drop-shadow(0 0 4px #A855F7); }
        to   { filter: drop-shadow(0 0 14px #7C3AED); }
      }
      .gear-spin {
        animation: spin 6s linear infinite;
        transform-origin: 234px 88px;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      .dots-anim {
        animation: dots 1.8s steps(4, end) infinite;
      }
      @keyframes dots {
        0%  { opacity:0; }
        25% { opacity:.4; }
        50% { opacity:.7; }
        75% { opacity:1; }
        100%{ opacity:0; }
      }
    </style>
  </defs>

  <!-- Soft background circle -->
  <circle cx="160" cy="200" r="155" fill="url(#bgGrad)" opacity="0.55"/>

  <!-- ======= THOUGHT BUBBLES (top-right) ======= -->
  <!-- Small dots leading to bubble -->
  <circle cx="206" cy="102" r="4" fill="#A855F7" class="pulse1"/>
  <circle cx="218" cy="88"  r="6" fill="#A855F7" class="pulse2"/>
  <circle cx="234" cy="72"  r="9" fill="#A855F7" class="pulse3"/>

  <!-- Main thought cloud -->
  <g class="pulse4">
    <ellipse cx="258" cy="52" rx="38" ry="24" fill="#FFFFFF" stroke="#A855F7" stroke-width="2"/>
    <ellipse cx="240" cy="62" rx="18" ry="14" fill="#FFFFFF" stroke="#A855F7" stroke-width="2"/>
    <ellipse cx="276" cy="62" rx="18" ry="14" fill="#FFFFFF" stroke="#A855F7" stroke-width="2"/>
    <ellipse cx="258" cy="70" rx="26" ry="12" fill="#FFFFFF" stroke="#A855F7" stroke-width="1.5"/>
    <!-- Gear icon inside thought -->
    <g class="gear-spin">
      <circle cx="258" cy="52" r="10" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
      <circle cx="258" cy="52" r="4"  fill="#7C3AED"/>
      <!-- Gear teeth -->
      <rect x="256" y="38" width="4" height="6"  rx="1" fill="#7C3AED"/>
      <rect x="256" y="60" width="4" height="6"  rx="1" fill="#7C3AED"/>
      <rect x="244" y="50" width="6" height="4"  rx="1" fill="#7C3AED"/>
      <rect x="266" y="50" width="6" height="4"  rx="1" fill="#7C3AED"/>
      <rect x="248" y="42" width="4" height="5"  rx="1" fill="#7C3AED" transform="rotate(45 250 44)"/>
      <rect x="264" y="42" width="4" height="5"  rx="1" fill="#7C3AED" transform="rotate(-45 266 44)"/>
      <rect x="248" y="57" width="4" height="5"  rx="1" fill="#7C3AED" transform="rotate(-45 250 59)"/>
      <rect x="264" y="57" width="4" height="5"  rx="1" fill="#7C3AED" transform="rotate(45 266 59)"/>
    </g>
  </g>

  <!-- ======= PANDA BODY (floating) ======= -->
  <g class="float-anim">

    <!-- Tail -->
    <ellipse cx="160" cy="298" rx="22" ry="12" fill="#E8E8E8"/>

    <!-- Body -->
    <ellipse cx="160" cy="248" rx="72" ry="82" fill="url(#bodyGrad)" stroke="#E0DEFF" stroke-width="1.5"/>

    <!-- Tummy patch (white circle) -->
    <ellipse cx="160" cy="255" rx="42" ry="52" fill="#FFFFFF" opacity="0.8"/>

    <!-- ======= PANDA HEAD ======= -->
    <circle cx="160" cy="152" r="72" fill="#FFFFFF" stroke="#E8E4FF" stroke-width="2"/>

    <!-- Ear left -->
    <ellipse cx="100" cy="98"  rx="24" ry="22" fill="#2D2D2D"/>
    <ellipse cx="100" cy="98"  rx="14" ry="12" fill="#4C1D95" opacity="0.6"/>

    <!-- Ear right -->
    <ellipse cx="220" cy="98"  rx="24" ry="22" fill="#2D2D2D"/>
    <ellipse cx="220" cy="98"  rx="14" ry="12" fill="#4C1D95" opacity="0.6"/>

    <!-- Eye patches -->
    <ellipse cx="133" cy="148" rx="22" ry="20" fill="#1E1B4B" transform="rotate(-10,133,148)"/>
    <ellipse cx="187" cy="148" rx="22" ry="20" fill="#1E1B4B" transform="rotate(10,187,148)"/>

    <!-- Eye whites -->
    <ellipse cx="133" cy="149" rx="13" ry="12" fill="#FFFFFF" class="blink-eye"/>
    <ellipse cx="187" cy="149" rx="13" ry="12" fill="#FFFFFF" class="blink-eye"/>

    <!-- Pupils -->
    <circle cx="135" cy="150" r="6" fill="#1E1B4B"/>
    <circle cx="185" cy="150" r="6" fill="#1E1B4B"/>

    <!-- Eye shine -->
    <circle cx="137" cy="147" r="2.5" fill="#FFFFFF"/>
    <circle cx="187" cy="147" r="2.5" fill="#FFFFFF"/>

    <!-- Nose -->
    <ellipse cx="160" cy="172" rx="11" ry="7" fill="#2D2D2D"/>

    <!-- Nostrils -->
    <circle cx="156" cy="173" r="2" fill="#1A1A1A"/>
    <circle cx="164" cy="173" r="2" fill="#1A1A1A"/>

    <!-- Smile -->
    <path d="M 148 182 Q 160 194 172 182" stroke="#2D2D2D" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Blush left -->
    <ellipse cx="116" cy="176" rx="12" ry="7" fill="#F9A8D4" opacity="0.45"/>
    <!-- Blush right -->
    <ellipse cx="204" cy="176" rx="12" ry="7" fill="#F9A8D4" opacity="0.45"/>

    <!-- ======= ARMS ======= -->
    <!-- Left arm (holding book) -->
    <ellipse cx="96"  cy="248" rx="20" ry="48" fill="#2D2D2D" transform="rotate(-18,96,248)"/>
    <ellipse cx="82"  cy="288" rx="16" ry="12" fill="#2D2D2D"/>

    <!-- Right arm (resting on book) -->
    <ellipse cx="224" cy="248" rx="20" ry="48" fill="#2D2D2D" transform="rotate(18,224,248)"/>
    <ellipse cx="238" cy="288" rx="16" ry="12" fill="#2D2D2D"/>

    <!-- Legs -->
    <ellipse cx="132" cy="320" rx="28" ry="18" fill="#2D2D2D"/>
    <ellipse cx="188" cy="320" rx="28" ry="18" fill="#2D2D2D"/>

  </g>

  <!-- ======= BOOK (separate float so it sways slightly differently) ======= -->
  <g class="float-anim-slow book-glow">
    <!-- Book shadow -->
    <ellipse cx="160" cy="345" rx="62" ry="8" fill="#7C3AED" opacity="0.18"/>

    <!-- Book back cover -->
    <rect x="108" y="298" width="104" height="68" rx="5" fill="#5B21B6"/>

    <!-- Book pages (white block) -->
    <rect x="114" y="294" width="92"  height="64" rx="4" fill="#FFFBFF" stroke="#DDD6FE" stroke-width="1"/>

    <!-- Page lines -->
    <line x1="122" y1="308" x2="198" y2="308" stroke="#DDD6FE" stroke-width="1.5"/>
    <line x1="122" y1="318" x2="198" y2="318" stroke="#DDD6FE" stroke-width="1.5"/>
    <line x1="122" y1="328" x2="182" y2="328" stroke="#DDD6FE" stroke-width="1.5"/>
    <line x1="122" y1="338" x2="190" y2="338" stroke="#DDD6FE" stroke-width="1.5"/>
    <line x1="122" y1="348" x2="176" y2="348" stroke="#DDD6FE" stroke-width="1.5"/>

    <!-- Book spine -->
    <rect x="108" y="294" width="12" height="68" rx="3" fill="#6D28D9"/>

    <!-- Book title text area -->
    <rect x="118" y="298" width="86" height="7" rx="2" fill="#A78BFA" opacity="0.6"/>

    <!-- Small "AI" text on book cover -->
    <text x="155" y="304" font-size="5" fill="#FFFFFF" text-anchor="middle" font-family="monospace" font-weight="bold">ACity RAG</text>

    <!-- Bookmark ribbon -->
    <polygon points="196,294 204,294 204,316 200,312 196,316" fill="#EC4899"/>
  </g>

  <!-- ======= PURPLE ACCENT DOTS (decorative) ======= -->
  <circle cx="48"  cy="148" r="5" fill="#A855F7" opacity="0.4" class="pulse1"/>
  <circle cx="38"  cy="188" r="3" fill="#7C3AED" opacity="0.3" class="pulse2"/>
  <circle cx="272" cy="168" r="4" fill="#A855F7" opacity="0.4" class="pulse3"/>
  <circle cx="284" cy="210" r="3" fill="#7C3AED" opacity="0.3" class="pulse1"/>

  <!-- ======= "THINKING..." label ======= -->
  <text x="160" y="372" font-size="13" fill="#6D28D9" text-anchor="middle"
        font-family="'Segoe UI', sans-serif" font-weight="600" class="dots-anim">
    Thinking about your query...
  </text>

</svg>
